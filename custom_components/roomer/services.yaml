refresh:
  name: Refresh Presence
  description: Force an immediate presence detection update
  fields:
    entity_id:
      name: Entity ID
      description: Optional entity to refresh (currently every tracked person and pet is refreshed)
      required: false
      example: sensor.ben_room
      selector:
        entity:
          domain: sensor
          integration: roomer

correct_room:
  name: Correct Room
  description: >-
    Manually correct a person's or pet's room (helps the system learn). The person is found from the
    sensor's Roomer configuration, so any Roomer room sensor works. The room must be one of the configured
    rooms, or away or unknown, otherwise the call fails with an error.
  fields:
    entity_id:
      name: Entity ID
      description: The room sensor to correct
      required: true
      example: sensor.ben_room
      selector:
        entity:
          domain: sensor
          integration: roomer
    room:
      name: Room
      description: A configured room (as shown in the Roomer setup), or away or unknown
      required: true
      example: office
      selector:
        text:
    confidence:
      name: Confidence
      description: Confidence level (0.0 to 1.0). Corrections below 0.7 are not learned.
      required: false
      default: 1.0
      example: 1.0
      selector:
        number:
          min: 0
          max: 1
          step: 0.1

get_history:
  name: Get History
  description: Get recent room transitions for a person
  fields:
    entity_name:
      name: Entity Name
      description: Name of the person (e.g., "Ben")
      required: true
      example: Ben
      selector:
        text:
    limit:
      name: Limit
      description: Maximum number of transitions to return
      required: false
      default: 20
      example: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1

clear_history:
  name: Clear History
  description: Clear room transition history
  fields:
    entity_name:
      name: Entity Name
      description: Name of the person (clears all if not specified)
      required: false
      example: Ben
      selector:
        text:

get_patterns:
  name: Get Patterns
  description: Get detected movement patterns for a person
  fields:
    entity_name:
      name: Entity Name
      description: Name of the person
      required: true
      example: Ben
      selector:
        text:

cleanup_storage:
  name: Cleanup Storage
  description: Clean up old event log data based on retention policy
  fields:
    retention_days:
      name: Retention Days
      description: Override retention period (days)
      required: false
      selector:
        number:
          min: 1
          max: 365
          mode: box
    max_file_size_mb:
      name: Max File Size (MB)
      description: Override max file size limit
      required: false
      selector:
        number:
          min: 1
          max: 1000
          step: 1
          mode: box

identify_person:
  name: Identify Person
  description: Identify which person or pet is visible on a camera using the vision model. Fires roomer_vision_identification with the result.
  fields:
    camera_entity_id:
      name: Camera
      description: Camera to take a snapshot from
      required: true
      example: camera.living_room
      selector:
        entity:
          domain: camera
    detection_type:
      name: Detection Type
      description: Whether to look for a person or an animal
      required: false
      default: person
      selector:
        select:
          options:
            - person
            - animal

enable_tracking:
  name: Enable Camera Tracking
  description: Turn on auto-tracking for a camera (turns on switch.<camera_name>_auto_tracking)
  fields:
    camera_name:
      name: Camera Name
      description: Camera name as used in its auto-tracking switch entity
      required: true
      example: living_room
      selector:
        text:

disable_tracking:
  name: Disable Camera Tracking
  description: Turn off auto-tracking for a camera (turns off switch.<camera_name>_auto_tracking)
  fields:
    camera_name:
      name: Camera Name
      description: Camera name as used in its auto-tracking switch entity
      required: true
      example: living_room
      selector:
        text:
